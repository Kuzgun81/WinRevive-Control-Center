name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore WinRevive.sln

      - name: Build
        run: dotnet build WinRevive.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/WinRevive.Tests/WinRevive.Tests.csproj --configuration Release --no-build

      - name: Publish self-contained application
        run: >
          dotnet publish src/WinRevive/WinRevive.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Publish elevated host
        run: >
          dotnet publish src/WinRevive.ElevatedHost/WinRevive.ElevatedHost.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/elevated-host

      - name: Bundle elevated host
        shell: powershell
        run: Copy-Item "artifacts/elevated-host/*" "artifacts/publish/" -Recurse -Force

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Setup.exe
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "src/WinRevive/bin/Release/net8.0-windows/win-x64/publish" | Out-Null
          Copy-Item "artifacts/publish/*" "src/WinRevive/bin/Release/net8.0-windows/win-x64/publish/" -Recurse -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer/WinRevive.iss"

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: winrevive-publish
          path: artifacts/publish

      - name: Upload GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer/Output/WinRevive-Setup.exe
            artifacts/publish/WinRevive.ControlCenter.exe
